name: Lean 4 build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-cache: true
      - run: lake build
      - name: Build C ABI
        run: make
